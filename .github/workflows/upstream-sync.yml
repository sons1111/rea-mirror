name: Upstream archive sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Preserve upstream branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mirror maintenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all upstream refs
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --prune upstream \
            '+refs/heads/*:refs/remotes/upstream/*' \
            '+refs/tags/*:refs/tags/upstream/*'

      - name: Fetch previous mirror branch heads
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --heads origin 'refs/heads/upstream/*' | grep -q .; then
            git fetch origin \
              '+refs/heads/upstream/*:refs/remotes/mirror/upstream/*'
          fi

      - name: Archive rewritten upstream branch heads
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r current_ref; do
            branch="${current_ref#refs/remotes/upstream/}"
            previous_ref="refs/remotes/mirror/upstream/$branch"
            if git show-ref --verify --quiet "$previous_ref"; then
              previous_sha=$(git rev-parse "$previous_ref")
              current_sha=$(git rev-parse "$current_ref")
              if [[ "$previous_sha" != "$current_sha" ]] && ! git merge-base --is-ancestor "$previous_sha" "$current_sha"; then
                archive_ref="refs/tags/archive/upstream-branch-heads/$previous_sha"
                if ! git show-ref --verify --quiet "$archive_ref"; then
                  git tag "${archive_ref#refs/tags/}" "$previous_sha"
                fi
              fi
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/upstream/)

          if git for-each-ref --format='%(refname)' refs/tags/archive/upstream-branch-heads/ | grep -q .; then
            git push origin \
              'refs/tags/archive/upstream-branch-heads/*:refs/tags/archive/upstream-branch-heads/*'
          fi

      - name: Fetch previous mirror tags
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin 'refs/tags/upstream/*' | grep -q .; then
            git fetch origin \
              '+refs/tags/upstream/*:refs/tags/mirror/upstream/*'
          fi

      - name: Archive rewritten upstream tags
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r current_ref; do
            tag_name="${current_ref#refs/tags/upstream/}"
            previous_ref="refs/tags/mirror/upstream/$tag_name"
            if git show-ref --verify --quiet "$previous_ref"; then
              previous_oid=$(git rev-parse "$previous_ref")
              current_oid=$(git rev-parse "$current_ref")
              if [[ "$previous_oid" != "$current_oid" ]]; then
                archive_ref="refs/tags/archive/upstream-tag-objects/$previous_oid"
                if ! git show-ref --verify --quiet "$archive_ref"; then
                  git tag "${archive_ref#refs/tags/}" "$previous_oid"
                fi
              fi
            fi
          done < <(git for-each-ref --format='%(refname)' refs/tags/upstream/)

          if git for-each-ref --format='%(refname)' refs/tags/archive/upstream-tag-objects/ | grep -q .; then
            git push origin \
              'refs/tags/archive/upstream-tag-objects/*:refs/tags/archive/upstream-tag-objects/*'
          fi

      - name: Publish namespaced upstream branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --force \
            'refs/remotes/upstream/*:refs/heads/upstream/*'

      - name: Publish namespaced upstream tags
        shell: bash
        run: |
          set -euo pipefail
          git push origin --force \
            'refs/tags/upstream/*:refs/tags/upstream/*'

      - name: Report preserved refs
        shell: bash
        run: |
          echo "Upstream branches: $(git for-each-ref --format='%(refname)' refs/remotes/upstream/ | wc -l)"
          echo "Upstream tags: $(git for-each-ref --format='%(refname)' refs/tags/upstream/ | wc -l)"
